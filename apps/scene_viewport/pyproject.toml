[project]
name = "scene-viewport"
version = "0.1.0"
description = "Scene viewport editor built on mtqt and pygfx. Not published."
requires-python = ">=3.13,<3.14"
dependencies = [
    "mtqt",
    "numba",
    "numpy",
    "pydantic>=2.10",
    "pygfx",
    "pylinalg",
    "rendercanvas",
    "trimesh>=4.5",
    "wgpu",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
scene-viewport = "scene_viewport.window:main"

[tool.uv.sources]
mtqt = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
