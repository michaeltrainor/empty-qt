[project]
name = "mtqt"
version = "0.2.0"
description = "Reusable PySide6 widgets, item models, and QSS for production Qt tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mtd3v" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyside6>=6.8.0.2,<6.9",
    "pydantic>=2.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
keywords = ["pyside6", "qt", "widgets", "models", "vfx"]

[tool.uv.workspace]
members = ["apps/scene_viewport"]

[project.urls]
Homepage = "https://github.com/michaeltrainor/empty-qt"
Repository = "https://github.com/michaeltrainor/empty-qt.git"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=6.0",
    "ruff>=0.17.3",
    "pyright>=1.1.400",
    "pre-commit>=4.2",
]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=0.29"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
src = ["src", "tests", "examples", "apps/scene_viewport/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D", "B", "C4", "SIM", "RUF", "PT", "T20"]
ignore = ["D102", "D104", "D105", "D107", "D203", "D213", "D401", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D", "T20"]
"apps/**" = ["D", "T20"]

[tool.ruff.lint.flake8-bugbear]
# Qt item-model signatures default parent to an invalid index.
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests", "apps/scene_viewport/tests"]
addopts = "--import-mode=importlib --cov=mtqt --cov-report=term-missing"
qt_log_level_fail = "WARNING"
# Offscreen platform noise: fonts not installed here, and a missing plugin call.
qt_log_ignore = [
    "Populating font family aliases",
    "propagateSizeHints",
    "Cannot find font directory",
]

[tool.coverage.run]
source_pkgs = ["mtqt"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pyright]
include = ["src", "apps/scene_viewport/src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
