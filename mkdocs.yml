site_name: mtqt
site_description: Reusable PySide6 widgets, models, and QSS
repo_url: https://github.com/michaeltrainor/empty-qt

theme:
  name: material
  palette:
    scheme: slate

watch:
  - src
  - docs

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Widgets: widgets.md
  - Models: models.md
  - Style: style.md
  - Embedding: embedding.md
  - Development: development.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            members_order: source
