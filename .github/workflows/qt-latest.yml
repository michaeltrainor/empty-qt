# Early warning for the next Qt. mtqt stays pinned to the VFX Reference Platform,
# so this runs on a schedule and a failure never blocks a pull request.

name: Latest PySide6

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-pyside:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libxkbcommon0 \
            libxcb-cursor0

      - name: Sync
        run: uv sync --locked --no-group docs

      - name: Upgrade PySide6 past the pin
        run: uv pip install --upgrade pyside6

      - name: Pytest
        run: uv run --no-sync pytest --no-cov
