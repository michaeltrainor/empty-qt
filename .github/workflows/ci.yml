name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      # QtGui imports libEGL even when tests set QT_QPA_PLATFORM=offscreen.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libxkbcommon0 \
            libxcb-cursor0

      - name: Sync
        # --all-packages adds the scene viewport app, so its tests run instead of skip.
        run: uv sync --all-packages --locked

      # One list of checks for CI, agents, and contributors: see scripts/check.
      - name: Check
        run: scripts/check

  # A separate job: branch protection requires the job named "check", and a
  # matrix there would rename it and block every PR.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Sync
        run: uv sync --all-packages --locked --no-group docs

      # --no-sync: `uv run` would otherwise re-sync the default groups, docs included.
      - name: Pytest
        run: uv run --no-sync pytest
