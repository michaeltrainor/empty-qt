# Docs and changelog gates for a ready pull request.
# Merging is the pr-reviewer agent's job. This workflow does not merge.

name: PR ready

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require changelog and docs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$PR_DRAFT" = "true" ]; then
            echo "Docs and changelog are enforced when the PR is ready."
            exit 0
          fi
          # Dependency bumps are not user-facing, so they need no changelog or docs.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: changelog and docs are not required."
            exit 0
          fi

          git fetch origin "$BASE_REF"
          mapfile -t files < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          printf '%s\n' "${files[@]}"

          changelog=0
          docs=0
          needs_docs=0
          for f in "${files[@]}"; do
            case "$f" in
              CHANGELOG.md) changelog=1 ;;
              docs/*) docs=1 ;;
              src/*|examples/*|apps/*|pyproject.toml) needs_docs=1 ;;
            esac
          done

          if [ "$changelog" -ne 1 ]; then
            echo "CHANGELOG.md must be updated under Unreleased before this PR can merge."
            exit 1
          fi
          if [ "$needs_docs" -eq 1 ] && [ "$docs" -ne 1 ]; then
            echo "update the MkDocs pages under docs/ before marking the PR ready."
            exit 1
          fi
