version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # Python and PySide6 follow the VFX Reference Platform, so move them by hand.
    ignore:
      - dependency-name: pyside6
      - dependency-name: pyside6-essentials
      - dependency-name: pyside6-addons
      - dependency-name: shiboken6
